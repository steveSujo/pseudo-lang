[package]
name = "psudo"
version = "0.4.0"
edition = "2021"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lsp-types = { version = "0.95", features = [] }
tower = "0.4"
tower-service = "0.3"
toml = "0.8"
cranelift-codegen = { version = "0.109", features = ["default"] }
cranelift-frontend = { version = "0.109", features = ["default"] }
cranelift-module = { version = "0.109", features = ["default"] }
cranelift-native = { version = "0.109", features = ["default"] }
cranelift-object = "0.109"
target-lexicon = "0.12"
object = "0.32"
goblin = "0.7"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "lsp_tests"

[[test]]
name = "codegen_tests"
path = "tests/codegen_tests.rs"